<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Zen 封面 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --sans:"Inter","Noto Sans SC",-apple-system,sans-serif; --sans-zh:"Noto Sans SC","PingFang SC",-apple-system,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace; }
  body { width:1080px; height:1440px; overflow:hidden; background:#F4F2ED; color:#2E2D29; display:flex; flex-direction:column; align-items:center; text-align:center; padding:64px 72px 52px; font-family:var(--sans-zh); position:relative; }
  .frame { position:absolute; inset:44px; border:1px solid #D8D3C6; pointer-events:none; }
  .side { position:absolute; top:120px; right:70px; writing-mode:vertical-rl; font-size:19px; letter-spacing:12px; color:#A39C8A; }
  .pg { font-size:22px; letter-spacing:6px; color:#A39C8A; font-family:var(--sans); margin-bottom:14px; }
  .en { font-size:22px; letter-spacing:8px; color:#8F887A; font-family:var(--sans); }
  h1 { margin-top:36px; font-size:130px; font-weight:300; line-height:1.2; letter-spacing:0; }
  h1 .r { color:#C73E3A; }
  .line { width:56px; border-top:2px solid #C73E3A; margin:36px auto 28px; }
  .sub { font-size:36px; color:#6B6558; letter-spacing:3px; line-height:1.8; }
  .stage { position:relative; flex:1; width:100%; min-height:0; }
  .wm { position:absolute; left:50%; top:60%; transform:translate(-50%,-50%); font-size:340px; font-weight:300; line-height:1; color:#E6E1D4; }
  .nodes { margin-top:44px; display:flex; align-items:center; }
  .nodes .nd { width:14px; height:14px; border:1.5px solid #A39C8A; border-radius:50%; background:#F4F2ED; flex-shrink:0; }
  .nodes .nd.hot { border-color:#C73E3A; background:#C73E3A; }
  .nodes .ln { width:56px; border-top:1px solid #C9C2B2; }
  .seal { position:absolute; right:88px; bottom:120px; width:60px; height:60px; border:2px solid #C73E3A; border-radius:6px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .seal .col { writing-mode:vertical-rl; font-size:18px; letter-spacing:4px; color:#C73E3A; line-height:1; }
  .foot { font-size:22px; letter-spacing:6px; color:#A39C8A; font-family:var(--sans); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="side">Anthropic 官方</div>
  <div class="pg">01</div>
  <div class="en">AI-NATIVE SDLC · PLAYBOOK</div>
  <h1>AI 写代码<br>快到飞起，<br>先崩掉的是<span class="r">流程</span></h1>
  <div class="line"></div>
  <div class="sub">六阶段被重新接线：<br>从线性流水线，到自动触发的闭环。</div>
  <div class="nodes">
    <div class="nd hot"></div><div class="ln"></div><div class="nd"></div><div class="ln"></div><div class="nd"></div><div class="ln"></div><div class="nd"></div><div class="ln"></div><div class="nd"></div><div class="ln"></div><div class="nd hot"></div>
  </div>
  <div class="stage">
    <div class="wm">環</div>
  </div>
  <div class="seal"><div class="col">手記</div><div class="col">工程</div></div>
  <div class="foot">六阶段 · 一图流 · 连载三篇</div>
</body>
</html>
