<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Zen 结尾页 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --sans:"Inter","Noto Sans SC",-apple-system,sans-serif; --sans-zh:"Noto Sans SC","PingFang SC",-apple-system,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace; }
  body { width:1080px; height:1440px; overflow:hidden; background:#F4F2ED; color:#2E2D29; display:flex; flex-direction:column; align-items:center; text-align:center; padding:88px 88px 64px; font-family:var(--sans-zh); position:relative; }
  .frame { position:absolute; inset:44px; border:1px solid #D8D3C6; pointer-events:none; }
  .side { position:absolute; top:120px; right:70px; writing-mode:vertical-rl; font-size:19px; letter-spacing:12px; color:#A39C8A; }
  .pg { font-size:22px; letter-spacing:6px; color:#A39C8A; font-family:var(--sans); margin-bottom:14px; }
  .en { font-size:22px; letter-spacing:8px; color:#8F887A; font-family:var(--sans); }
  .statement { margin-top:110px; font-size:60px; font-weight:300; line-height:1.6; letter-spacing:2px; max-width:880px; text-wrap:balance; }
  .statement b { color:#C73E3A; font-weight:400; }
  .line { width:56px; border-top:2px solid #C73E3A; margin:56px auto 34px; }
  .src { font-size:22px; letter-spacing:4px; color:#A39C8A; font-family:var(--sans); }
  .stage { position:relative; flex:1; width:100%; min-height:0; }
  .wm { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:380px; font-weight:300; line-height:1; color:#E6E1D4; }
  .cta { font-size:26px; letter-spacing:3px; color:#6B6558; }
  .seal { position:absolute; right:88px; bottom:150px; width:60px; height:60px; border:2px solid #C73E3A; border-radius:6px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .seal .col { writing-mode:vertical-rl; font-size:18px; letter-spacing:4px; color:#C73E3A; line-height:1; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="side">Anthropic 官方</div>
  <div class="pg">03</div>
  <div class="en">AI-NATIVE SDLC · PLAYBOOK</div>
  <div class="statement">流程不再是一条线，而是一个<b>自动触发的闭环</b>。人从执行者，变成守在闸口的<b>判断者</b>。</div>
  <div class="line"></div>
  <div class="src">来源 · Anthropic Engineering · AI-Native SDLC Playbook</div>
  <div class="stage"><div class="wm">環</div></div>
  <div class="cta">收藏这组图 · 下一期拆「闸口」</div>
  <div class="seal"><div class="col">手記</div><div class="col">工程</div></div>
</body>
</html>
