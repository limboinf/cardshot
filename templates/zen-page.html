<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Zen 内容页 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --sans:"Inter","Noto Sans SC",-apple-system,sans-serif; --sans-zh:"Noto Sans SC","PingFang SC",-apple-system,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace; }
  body { width:1080px; height:1440px; overflow:hidden; background:#F4F2ED; color:#2E2D29; display:flex; flex-direction:column; padding:76px 96px 60px; font-family:var(--sans-zh); position:relative; }
  .frame { position:absolute; inset:44px; border:1px solid #D8D3C6; pointer-events:none; }
  .side { position:absolute; top:120px; right:70px; writing-mode:vertical-rl; font-size:19px; letter-spacing:12px; color:#A39C8A; }
  .top { display:flex; align-items:baseline; justify-content:space-between; font-family:var(--sans); font-size:20px; letter-spacing:5px; color:#A39C8A; }
  .kicker { margin-top:52px; font-size:22px; letter-spacing:6px; color:#A39C8A; font-family:var(--sans); }
  h2 { margin-top:24px; font-size:64px; font-weight:400; line-height:1.4; letter-spacing:2px; }
  .rows { margin-top:44px; border-top:1px solid #D8D3C6; flex:1; display:flex; flex-direction:column; }
  .row { display:flex; align-items:center; gap:32px; padding:36px 0; border-bottom:1px solid #D8D3C6; flex:1; }
  .row .no { width:64px; flex-shrink:0; font-size:30px; color:#C73E3A; }
  .row .name { width:220px; flex-shrink:0; font-size:42px; font-weight:500; font-family:var(--sans); }
  .row .name .zh { font-size:22px; font-weight:400; color:#A39C8A; margin-left:12px; letter-spacing:3px; }
  .row .txt { flex:1; }
  .row .mech { font-size:32px; line-height:1.6; color:#5C584F; text-wrap:balance; }
  .row .out { margin-top:10px; font-size:22px; color:#A39C8A; font-family:var(--mono); }
  .conclusion { margin-top:40px; }
  .conclusion .line { width:56px; border-top:2px solid #C73E3A; margin-bottom:24px; }
  .conclusion .txt { font-size:36px; line-height:1.8; letter-spacing:1px; }
  .conclusion .txt b { color:#C73E3A; font-weight:600; }
  .foot { display:flex; justify-content:space-between; margin-top:36px; font-size:20px; letter-spacing:4px; color:#A39C8A; font-family:var(--sans); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="side">Anthropic 官方</div>
  <div class="top"><div>AI-NATIVE SDLC · PLAYBOOK</div><div>02</div></div>
  <div class="kicker">Ⅰ — Ⅲ · 从需求到开发</div>
  <h2>前三步，压成一次会话</h2>
  <div class="rows">
    <div class="row">
      <div class="no">一</div>
      <div class="name">Plan<span class="zh">需求</span></div>
      <div class="txt"><div class="mech">有想法的人直接跟 Claude 聊，不排队等 PM 写文档</div><div class="out">→ intent.md</div></div>
    </div>
    <div class="row">
      <div class="no">二</div>
      <div class="name">Design<span class="zh">设计</span></div>
      <div class="txt"><div class="mech">需求与设计压成一次会话，政策当场生效</div><div class="out">→ spec.md</div></div>
    </div>
    <div class="row">
      <div class="no">三</div>
      <div class="name">Build<span class="zh">开发</span></div>
      <div class="txt"><div class="mech">先出计划再动手，机构知识写进文件</div><div class="out">→ plan.md</div></div>
    </div>
  </div>
  <div class="conclusion">
    <div class="line"></div>
    <div class="txt">三步的产物都是一份 .md：<br>产品 owner 和 agent 读的是<b>同一份文件</b>。</div>
  </div>
  <div class="foot"><div>SOURCE · ANTHROPIC ENGINEERING</div><div>下一页 · Ⅳ → Ⅵ</div></div>
</body>
</html>
