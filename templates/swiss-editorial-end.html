<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Swiss Editorial 结尾页 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sans:"Inter","Noto Sans SC",-apple-system,sans-serif;
    --sans-zh:"Noto Sans SC","PingFang SC",-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#111213; --sub:#333333; --mute:#666666; --faint:#999999;
    --paper:#F4F4F2; --line:#DDDAD4; --accent:#4E7A52;
  }
  body { width:1080px; height:1440px; overflow:hidden; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; padding:64px 80px 52px; font-family:var(--sans-zh); }
  .head { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:16px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:20px; color:var(--ink); letter-spacing:1px; }
  .head .r { color:var(--faint); }
  .mid { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .statement { font-size:68px; font-weight:300; line-height:1.45; letter-spacing:0; color:var(--ink); font-family:var(--sans); text-wrap:balance; }
  .statement b { font-weight:500; }
  .dash { width:80px; height:4px; background:var(--accent); margin-top:56px; }
  .srow { margin-top:52px; font-size:28px; color:var(--faint); letter-spacing:2px; }
  .srow .n { font-size:72px; font-weight:200; color:var(--ink); font-family:var(--sans); }
  .srow .n.g { color:var(--accent); }
  .src { margin-top:36px; font-size:22px; color:var(--faint); letter-spacing:2px; }
  .foot { margin-top:auto; border-top:1px solid var(--line); padding-top:20px; display:flex; justify-content:space-between; font-family:var(--mono); font-size:20px; color:var(--faint); letter-spacing:2px; }
  .foot .cta { color:var(--accent); }
</style>
</head>
<body>
  <div class="head"><div>AI-NATIVE SDLC · PLAYBOOK</div><div class="r">03</div></div>
  <div class="mid">
    <div class="statement">流程不再是一条线，而是一个<b>自动触发的闭环</b>。人从执行者，变成守在闸口的<b>判断者</b>。</div>
    <div class="dash"></div>
    <div class="srow"><span class="n">3</span> 篇 · <span class="n">6</span> 阶段 · <span class="n g">1</span> 闭环</div>
    <div class="src">来源 · Anthropic Engineering · AI-Native SDLC Playbook</div>
  </div>
  <div class="foot"><div>ANTHROPIC OFFICIAL</div><div class="cta">收藏这组图 · 下一期拆「闸口」→</div></div>
</body>
</html>
