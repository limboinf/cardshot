<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Editorial 封面 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;700;900&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --serif-zh:"Noto Serif SC","Songti SC","STSong",serif; --serif-en:"Playfair Display","Noto Serif SC",serif; --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; }
  body { width:1080px; height:1440px; overflow:hidden; background:#F7F4EE; color:#1A1A1A; display:flex; flex-direction:column; padding:72px 84px 60px; font-family:var(--serif-zh); }
  .masthead { display:flex; align-items:baseline; justify-content:space-between; border-bottom:3px solid #1A1A1A; padding-bottom:18px; }
  .masthead .brand { font-size:32px; font-weight:900; letter-spacing:10px; }
  .masthead .no { font-size:24px; letter-spacing:2px; font-family:var(--mono); }
  .kicker { margin-top:52px; font-size:24px; letter-spacing:5px; color:#C8321E; font-weight:500; }
  h1 { margin-top:34px; font-size:120px; font-weight:500; line-height:1.32; letter-spacing:2px; }
  h1 .big { font-size:200px; font-weight:500; color:#C8321E; line-height:1.1; }
  .anchor { width:400px; height:10px; background:#C8321E; margin-top:30px; }
  .lede { margin-top:38px; font-size:36px; color:#6B6558; line-height:1.7; max-width:880px; text-wrap:balance; }
  .bottom { margin-top:auto; }
  .cta { display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid #1A1A1A; border-bottom:1px solid #1A1A1A; padding:20px 0; }
  .cta .seq { font-size:30px; letter-spacing:2px; }
  .cta .go { font-size:30px; color:#C8321E; font-weight:700; }
  .foot { padding-top:16px; font-size:22px; color:#6B6558; letter-spacing:3px; font-family:var(--mono); }
</style>
</head>
<body>
  <div class="masthead"><div class="brand">工程手记</div><div class="no">01</div></div>
  <div class="kicker">Anthropic 官方 · AI-Native SDLC Playbook</div>
  <h1>AI 写代码<br>快到飞起，<br>先崩掉的是<br><span class="big">流程</span></h1>
  <div class="anchor"></div>
  <div class="lede">六阶段被重新接线：从线性流水线，到自动触发的闭环。</div>
  <div class="bottom">
    <div class="cta"><div class="seq">六阶段 · 一图流 · 连载三篇</div><div class="go">左滑开拆 →</div></div>
    <div class="foot">ENGINEERING NOTES</div>
  </div>
</body>
</html>
