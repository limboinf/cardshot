<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Editorial 结尾页 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;700;900&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --serif-zh:"Noto Serif SC","Songti SC","STSong",serif; --serif-en:"Playfair Display","Noto Serif SC",serif; --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; }
  body { width:1080px; height:1440px; overflow:hidden; background:#F7F4EE; color:#1A1A1A; display:flex; flex-direction:column; padding:72px 84px 60px; font-family:var(--serif-zh); position:relative; }
  .masthead { display:flex; align-items:baseline; justify-content:space-between; border-bottom:3px solid #1A1A1A; padding-bottom:18px; }
  .masthead .brand { font-size:32px; font-weight:900; letter-spacing:10px; }
  .masthead .no { font-size:24px; letter-spacing:2px; font-family:var(--mono); }
  .mid { flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; }
  .mark { position:absolute; top:-30px; left:-20px; font-size:320px; line-height:1; color:#C8321E; opacity:.18; font-family:var(--serif-en); }
  .statement { font-size:68px; font-weight:500; line-height:1.5; letter-spacing:1px; position:relative; text-wrap:balance; }
  .statement b { color:#C8321E; }
  .dash { width:80px; height:6px; background:#C8321E; margin-top:52px; }
  .src { margin-top:34px; font-size:24px; color:#6B6558; letter-spacing:2px; }
  .bottom { margin-top:auto; }
  .cta { border-top:3px solid #1A1A1A; padding-top:26px; font-size:32px; font-weight:700; letter-spacing:1px; }
  .foot { display:flex; justify-content:space-between; margin-top:26px; font-size:22px; color:#6B6558; letter-spacing:3px; font-family:var(--mono); }
</style>
</head>
<body>
  <div class="masthead"><div class="brand">工程手记</div><div class="no">03</div></div>
  <div class="mid">
    <div class="mark">“</div>
    <div class="statement">流程不再是一条线，而是一个<b>自动触发的闭环</b>。人从执行者，变成守在闸口的<b>判断者</b>。</div>
    <div class="dash"></div>
    <div class="src">来源 · Anthropic Engineering · AI-Native SDLC Playbook</div>
  </div>
  <div class="bottom">
    <div class="cta">收藏这组图 · 下一期拆「闸口」→</div>
    <div class="foot"><div>ENGINEERING NOTES</div><div>工程手记</div></div>
  </div>
</body>
</html>
