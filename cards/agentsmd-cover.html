<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Swiss 封面 · Claude Code 支持 AGENTS.md</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
  :root { --sans:"Inter","Noto Sans SC",-apple-system,sans-serif; --sans-zh:"Noto Sans SC","PingFang SC",-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:var(--sans-zh); background:#FFFFFF; color:#111; display:flex; flex-direction:column; padding:64px 60px 56px; position:relative; }
  .cross { position:absolute; font-size:34px; font-weight:300; color:#C9C9C9; }
  .top { display:flex; justify-content:space-between; align-items:baseline; font-size:24px; font-weight:500; letter-spacing:3px; font-family:var(--mono); }
  .top .no { color:#E0311D; }
  h1 { margin-top:44px; font-size:136px; font-weight:300; line-height:1.2; letter-spacing:-1px; font-family:var(--sans); }
  h1 .r { color:#E0311D; }
  .sub { margin-top:44px; font-size:36px; color:#3D3D3D; line-height:1.55; max-width:820px; text-wrap:balance; }
  .sub .m { font-family:var(--mono); font-size:32px; font-weight:500; }
  .anchor { margin-top:auto; text-align:right; font-size:180px; font-weight:200; line-height:.9; letter-spacing:2px; color:transparent; -webkit-text-stroke:4px #E0311D; font-family:var(--sans); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:24px; }
  .cell { border:3px solid #111; padding:30px 20px 28px; text-align:center; background:#fff; color:#111; }
  .cell.hot { background:#E0311D; border-color:#E0311D; color:#fff; }
  .cell b { display:block; font-size:30px; font-weight:500; font-family:var(--mono); letter-spacing:0; }
  .cell span { display:block; margin-top:10px; font-size:18px; font-weight:500; letter-spacing:2px; font-family:var(--mono); }
  .bar { height:14px; background:#E0311D; margin-top:26px; }
  .foot { display:flex; justify-content:space-between; margin-top:22px; font-size:22px; font-weight:500; letter-spacing:3px; color:#111; font-family:var(--mono); }
</style>
</head>
<body>
  <div class="cross" style="top:56px; left:46%;">+</div>
  <div class="cross" style="top:44%; right:64px;">+</div>
  <div class="top"><div>CLAUDE CODE · CHANGELOG</div><div class="no">v2.1.277</div></div>
  <h1>AI 编程的<br>指令文件，<br><span class="r">统一</span>了</h1>
  <div class="sub">Claude Code 起支持 <span class="m">AGENTS.md</span>：无 CLAUDE.md 时自动读取，<span class="m">/config</span> 可切换。</div>
  <div class="anchor">MD</div>
  <div class="grid">
    <div class="cell hot"><b>AGENTS.md</b><span>NEW · UNIFIED</span></div>
    <div class="cell"><b>CLAUDE.md</b><span>CLAUDE CODE</span></div>
    <div class="cell"><b>GEMINI.md</b><span>GEMINI CLI</span></div>
    <div class="cell"><b>.cursorrules</b><span>CURSOR</span></div>
    <div class="cell"><b>.windsurfrules</b><span>WINDSURF</span></div>
    <div class="cell"><b>/config</b><span>TOGGLE · 可切换</span></div>
  </div>
  <div class="bar"></div>
  <div class="foot"><div>AGENT INSTRUCTIONS</div><div>ANTHROPIC OFFICIAL</div></div>
</body>
</html>
