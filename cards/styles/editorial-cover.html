<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Editorial 封面 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;700;900&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --serif-zh:"Noto Serif SC","Songti SC","STSong",serif; --serif-en:"Playfair Display","Noto Serif SC",serif; --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; }
  body { width:1080px; height:1440px; overflow:hidden; background:#f7f4ee; color:#1a1a1a; display:flex; flex-direction:column; padding:72px 80px 64px; font-family:var(--serif-zh); }
  .serif { font-family:var(--serif-zh); }
  .masthead { display:flex; align-items:baseline; justify-content:space-between; border-bottom:3px solid #1a1a1a; padding-bottom:18px; }
  .masthead .brand { font-size:32px; font-weight:900; letter-spacing:10px; }
  .masthead .meta { font-size:20px; color:#6b6558; letter-spacing:2px; font-family:var(--mono); }
  .kicker { margin:56px 0 24px 18px; font-size:22px; letter-spacing:6px; color:#c8321e; font-weight:500; }
  h1 { font-size:110px; font-weight:500; line-height:1.36; letter-spacing:2px; margin-left:18px; }
  h1 em { font-style:normal; color:#c8321e; border-bottom:8px solid #c8321e; padding-bottom:4px; }
  .lede { margin:32px 0 0 18px; font-size:31px; color:#6b6558; line-height:1.75; max-width:920px; }
  .pull { margin:46px 0 0 18px; border-left:6px solid #c8321e; padding:6px 0 6px 30px; }
  .pull .big { font-size:62px; font-weight:500; letter-spacing:2px; }
  .pull .big .r { color:#c8321e; }
  .pull .cap { margin-top:12px; font-size:21px; color:#8a8272; letter-spacing:4px; font-family:var(--serif-en); }
  .toc { margin-top:auto; border-top:3px solid #1a1a1a; padding-top:24px; }
  .toc .cap { font-size:20px; letter-spacing:6px; color:#8a8272; margin-bottom:14px; }
  .toc .row { display:flex; align-items:baseline; gap:24px; padding:11px 0; border-bottom:1px solid #c9c2b2; }
  .toc .row .no { font-size:22px; color:#c8321e; font-weight:500; width:64px; flex-shrink:0; font-family:var(--mono); }
  .toc .row .t { font-size:27px; font-weight:500; flex:1; }
  .toc .row .pg { font-size:20px; color:#8a8272; letter-spacing:2px; font-family:var(--mono); }
  .bottom { margin-top:34px; }
  .rule { border-top:1px solid #1a1a1a; margin-bottom:22px; }
  .foot { display:flex; justify-content:space-between; font-size:20px; color:#8a8272; letter-spacing:3px; font-family:var(--mono); }
  .foot .go { color:#c8321e; font-weight:700; }
</style>
</head>
<body>
  <div class="masthead">
    <div class="brand serif">工程手记</div>
    <div class="meta">01</div>
  </div>
  <div class="kicker serif">Anthropic 官方 · AI-Native SDLC Playbook</div>
  <h1 class="serif">AI 写代码<br>快到飞起，<br>先崩掉的是<em>流程</em></h1>
  <div class="lede serif">软件开发六阶段被重新接线：从线性流水线，到自动触发的闭环。</div>
  <div class="pull">
    <div class="big serif"><span class="r">6</span> 个阶段 · <span class="r">1</span> 个闭环</div>
    <div class="cap serif">ALL IN ONE FLOW · 一图流</div>
  </div>
  <div class="toc">
    <div class="row"><span class="no serif">P.02</span><span class="t serif">六阶段总览 · 一图流</span><span class="pg serif">OVERVIEW</span></div>
    <div class="row"><span class="no serif">P.05</span><span class="t serif">闸口与判断 · 人的新位置</span><span class="pg serif">GATE</span></div>
    <div class="row"><span class="no serif">P.08</span><span class="t serif">反模式清单 · 别这样跑</span><span class="pg serif">ANTI</span></div>
  </div>
  <div class="bottom">
    <div class="rule"></div>
    <div class="foot serif"><span>ENGINEERING NOTES</span><span class="go">连载 · 未完待续 →</span></div>
  </div>
</body>
</html>
