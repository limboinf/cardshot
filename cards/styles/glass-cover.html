<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Glass 封面 · AI-Native SDLC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif; color:#eef0ff; display:flex; flex-direction:column; padding:76px 68px; background:
    radial-gradient(620px 620px at 88% 6%, rgba(139,92,246,.45), transparent 68%),
    radial-gradient(560px 560px at 4% 96%, rgba(34,211,238,.28), transparent 68%),
    linear-gradient(135deg,#1b1035 0%,#101a45 55%,#0c1230 100%); }
  .tag { align-self:flex-start; display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:14px 30px; font-size:25px; font-weight:600; letter-spacing:1px; margin-bottom:auto; backdrop-filter:blur(20px); }
  .tag .dot { width:12px; height:12px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#22d3ee); }
  .en { font-size:26px; letter-spacing:10px; color:#aab2d5; font-weight:600; margin-bottom:24px; }
  h1 { font-size:96px; font-weight:800; line-height:1.24; letter-spacing:-1px; }
  h1 .grad { background:linear-gradient(90deg,#7dd3fc,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:28px; font-size:28px; color:#aab2d5; line-height:1.6; }
  .stages { margin-top:44px; display:flex; gap:12px; }
  .stages .pill { flex:1; text-align:center; font-size:19px; font-weight:700; letter-spacing:1px; color:#c8cfec; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:12px 0; backdrop-filter:blur(20px); font-family:ui-monospace,Menlo,monospace; }
  .stats { margin-top:auto; display:flex; gap:20px; }
  .stat { flex:1; border-radius:22px; padding:28px 30px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); box-shadow:inset 0 1px 0 rgba(255,255,255,.30), 0 12px 40px rgba(8,10,30,.35); backdrop-filter:blur(20px); }
  .stat b { font-size:64px; font-weight:800; background:linear-gradient(135deg,#a78bfa,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat span { display:block; margin-top:8px; font-size:22px; color:#aab2d5; font-weight:600; }
  .foot { margin-top:30px; text-align:center; font-size:21px; color:#8b93b8; letter-spacing:6px; }
</style>
</head>
<body>
  <div class="tag"><div class="dot"></div>Anthropic 官方 · 2026.8.21 新文</div>
  <div class="en">AI-NATIVE SDLC</div>
  <h1>AI 写代码快到飞起<br>先崩掉的是<span class="grad">流程</span></h1>
  <div class="sub">软件开发六阶段改造 · 一图流拆解</div>
  <div class="stages">
    <div class="pill">01 PLAN</div><div class="pill">02 DESIGN</div><div class="pill">03 BUILD</div><div class="pill">04 TEST</div><div class="pill">05 SHIP</div><div class="pill">06 LOOP</div>
  </div>
  <div class="stats">
    <div class="stat"><b>6</b><span>个阶段重构</span></div>
    <div class="stat"><b>1</b><span>个自动闭环</span></div>
    <div class="stat"><b>0</b><span>份排队文档</span></div>
  </div>
  <div class="foot">SWIPE →</div>
</body>
</html>
