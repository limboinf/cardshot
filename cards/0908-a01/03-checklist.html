<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>0908-A01 验收三步清单卡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{width:1080px;height:1440px;overflow:hidden}
  body{width:1080px;height:1440px;overflow:hidden;position:relative;background:#F7F1E5;
    font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    color:#1A1A1A;padding:150px 64px 110px;display:flex;flex-direction:column}
  .badge{position:absolute;top:52px;left:64px;background:#FF2442;color:#fff;
    font-size:32px;font-weight:800;padding:14px 28px;border-radius:12px;letter-spacing:2px}
  .sig{position:absolute;bottom:42px;right:64px;color:#9B9284;font-size:26px;font-weight:600}
  h2{font-size:64px;font-weight:900;line-height:1.25}
  h2 .red{color:#FF2442}
  .sub{margin-top:20px;font-size:36px;color:#6B6B6B;font-weight:600}
  .steps{margin-top:54px;display:flex;flex-direction:column;gap:36px}
  .step{background:#fff;border:3px solid #E8DFC9;border-radius:22px;
    padding:36px 40px;display:flex;gap:30px;align-items:flex-start}
  .num{flex:0 0 auto;font-size:56px;font-weight:900;color:#FF2442;line-height:1}
  .step h3{font-size:42px;font-weight:800;margin-bottom:14px}
  .step p{font-size:32px;line-height:1.55;color:#4A4437}
  .step p b{color:#1A1A1A;font-weight:800}
  .concl{margin-top:auto;background:#1A1A1A;color:#fff;border-radius:22px;
    padding:38px 44px;font-size:42px;font-weight:900}
  .concl .red{color:#FF5C72}
</style>
</head>
<body>
  <div class="badge">Agent 踩坑记 #01</div>
  <h2>AI 产出进正文前，<span class="red">验收三步</span></h2>
  <div class="sub">直接抄，收藏这篇就够</div>
  <div class="steps">
    <div class="step"><div class="num">01</div>
      <div><h3>回读产物</h3>
      <p>AI 报什么路径，就打开什么路径——<b>文件在、条目数对得上</b>才算数，别信"完毕"两个字</p></div>
    </div>
    <div class="step"><div class="num">02</div>
      <div><h3>口径核对</h3>
      <p>每个数字过三问：<b>谁报的 / 怎么量的 / 何时测的</b>——"3.1 倍"是运行时长口径，写成"1 个 AI 顶 3.1 个人"当场翻车</p></div>
    </div>
    <div class="step"><div class="num">03</div>
      <div><h3>信源分级</h3>
      <p>公司自报 = 说法，<b>≠ 事实</b>——引用时原样标注"XX 自报"，立场自动立住，评论区抓不到把柄</p></div>
    </div>
  </div>
  <div class="concl">发出去的每个数，都能<span class="red">指回底稿</span></div>
  <div class="sig">Limbo.py · 也做AI</div>
</body>
</html>
