<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>0908-A01 翻车现场对照卡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{width:1080px;height:1440px;overflow:hidden}
  body{width:1080px;height:1440px;overflow:hidden;position:relative;background:#F7F1E5;
    font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    color:#1A1A1A;padding:150px 64px 110px;display:flex;flex-direction:column}
  .badge{position:absolute;top:52px;left:64px;background:#FF2442;color:#fff;
    font-size:32px;font-weight:800;padding:14px 28px;border-radius:12px;letter-spacing:2px}
  .sig{position:absolute;bottom:42px;right:64px;color:#9B9284;font-size:26px;font-weight:600}
  h2{font-size:64px;font-weight:900;line-height:1.25}
  h2 .red{color:#FF2442}
  .panel{border-radius:22px;padding:40px 44px;margin-top:44px}
  .panel .tag{display:inline-block;font-size:30px;font-weight:800;padding:10px 24px;
    border-radius:999px;margin-bottom:26px}
  .say{background:#fff;border:3px solid #E8DFC9}
  .say .tag{background:#EAF7EE;color:#1F7A46}
  .say .bubble{font-size:44px;line-height:1.5;font-weight:600;color:#1A1A1A}
  .chk{background:#161311}
  .chk .tag{background:#3A2F2B;color:#FFB4A0}
  .term{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:30px;line-height:1.8;color:#EDE6D6}
  .term .p{color:#8FD18C}
  .term .err{color:#FF7A6B;font-weight:700}
  .vs{display:flex;align-items:center;gap:26px;margin-top:14px;color:#B7AD98;
    font-size:30px;font-weight:700}
  .vs::before,.vs::after{content:"";flex:1;height:3px;background:#E0D6BE;border-radius:2px}
  .concl{margin-top:auto;background:#1A1A1A;color:#fff;border-radius:22px;
    padding:40px 46px;font-size:46px;font-weight:900}
  .concl .red{color:#FF5C72}
  .concl small{display:block;margin-top:16px;font-size:30px;font-weight:500;color:#C9C2B4}
</style>
</head>
<body>
  <div class="badge">Agent 踩坑记 #01</div>
  <h2>翻车现场：<span class="red">同一个下午</span>，两份事实</h2>
  <div class="panel say">
    <span class="tag">它汇报的</span>
    <div class="bubble">"今日 AI 资讯实抓完毕，<br>底稿已落盘，随时可查。"</div>
  </div>
  <div class="vs">我随手开终端查了一眼</div>
  <div class="panel chk">
    <span class="tag">盘上实查</span>
    <div class="term">
      <div><span class="p">$</span> ls ~/work/pipeline/aihot-20260907/</div>
      <div class="err">ls: No such file or directory</div>
      <div><span class="p">$</span> find ~/work -name "*aihot*"</div>
      <div class="err">0 results</div>
    </div>
  </div>
  <div class="concl">流程跑完 ≠ 结果为真
    <small>"报完毕"是流程语言，不是事实语言——<span class="red">差一道验收</span>，这篇笔记就是事故现场</small>
  </div>
  <div class="sig">Limbo.py · 也做AI</div>
</body>
</html>
