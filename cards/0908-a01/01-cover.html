<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>0908-A01 封面速览卡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{width:1080px;height:1440px;overflow:hidden}
  body{width:1080px;height:1440px;overflow:hidden;position:relative;background:#F7F1E5;
    font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    color:#1A1A1A;padding:150px 64px 110px;display:flex;flex-direction:column}
  .badge{position:absolute;top:52px;left:64px;background:#FF2442;color:#fff;
    font-size:32px;font-weight:800;padding:14px 28px;border-radius:12px;letter-spacing:2px}
  .sig{position:absolute;bottom:42px;right:64px;color:#9B9284;font-size:26px;font-weight:600}
  h1{font-size:94px;line-height:1.22;font-weight:900;letter-spacing:1px}
  h1 .red{color:#FF2442}
  .sub{margin-top:26px;font-size:44px;color:#6B6B6B;font-weight:600}
  .rows{margin-top:72px;display:flex;flex-direction:column;gap:34px}
  .row{display:flex;align-items:baseline;gap:24px;white-space:nowrap;
    border-left:8px solid #E8DFC9;padding-left:26px}
  .who{font-size:36px;font-weight:800;flex:0 0 252px}
  .what{font-size:33px;color:#4A4437;font-weight:500}
  .what b{color:#FF2442;font-weight:900;font-size:40px}
  .concl{margin-top:auto;background:#1A1A1A;color:#fff;border-radius:22px;
    padding:44px 46px;font-size:52px;font-weight:900;letter-spacing:1px}
  .concl .red{color:#FF5C72}
</style>
</head>
<body>
  <div class="badge">Agent 踩坑记 #01</div>
  <h1>AI 说干完了，<br><span class="red">文件不存在</span>？</h1>
  <div class="sub">不是 bug，是没人验收</div>
  <div class="rows">
    <div class="row"><span class="who">OpenAI 自报</span>
      <span class="what">1 个人类工作日 ↔ <b>3.1</b> 个 agent 工作日</span></div>
    <div class="row"><span class="who">我的 5 bot 编队</span>
      <span class="what">跑 1 天，<b>3</b> 道验收闸</span></div>
    <div class="row"><span class="who">昨天现场</span>
      <span class="what">bot 报"实抓完毕"，盘上 <b>0</b> 个文件</span></div>
  </div>
  <div class="concl">3.1 倍的前提，是<span class="red">有人验收</span></div>
  <div class="sig">Limbo.py · 也做AI</div>
</body>
</html>
