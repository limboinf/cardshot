<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>GLM 5.2 开源实测 · Doodle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif; color:#3b3a36; display:flex; flex-direction:column; padding:80px 84px 72px; position:relative; background:
    radial-gradient(900px 600px at 80% 0%, rgba(210,180,120,.14), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(210,180,120,.12), transparent 60%),
    repeating-linear-gradient(105deg, rgba(120,100,60,.035) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(12deg, rgba(120,100,60,.03) 0 1px, transparent 1px 5px),
    #f9f3e6; }
  .kai { font-family:"Kaiti SC","STKaiti","PingFang SC",serif; }
  .frame { position:absolute; inset:44px; border:2px dashed rgba(59,58,54,.45); border-radius:18px 8px 22px 10px; pointer-events:none; }
  .head { display:flex; align-items:center; margin-bottom:56px; }
  .tag { display:inline-block; background:#fffdf6; border:3px solid #3b3a36; border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; padding:14px 30px; font-size:25px; font-weight:800; }
  h1 { font-size:110px; font-weight:700; line-height:1.32; letter-spacing:2px; margin-left:14px; }
  h1 .mk { color:#3b3a36; text-decoration:underline wavy #d95763 7px; text-underline-offset:16px; }
  .sub { margin-top:32px; font-size:33px; color:#6b6558; margin-left:18px; }
  .sub .arrow { color:#4a69bd; font-weight:800; }
  .note { margin:46px 0 0 22px; display:inline-block; font-size:32px; font-weight:800; background:linear-gradient(transparent 55%, rgba(247,215,116,.9) 55%); padding:4px 10px; }
  .scribble { margin:52px 0 0 96px; display:inline-block; border:3px solid #d95763; border-radius:15px 225px 15px 255px / 225px 15px 255px 15px; padding:16px 30px; font-size:27px; font-weight:800; color:#d95763; background:rgba(255,253,246,.7); }
  .seq { margin-top:auto; display:flex; gap:16px; margin-bottom:44px; }
  .cell { flex:1; background:#fffdf6; border:3px solid #3b3a36; border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; text-align:center; padding:20px 0 16px; }
  .cell b { display:block; font-size:31px; font-weight:800; }
  .cell span { font-size:19px; font-weight:700; color:#8a7f6e; white-space:nowrap; }
  .foot { display:flex; align-items:center; gap:26px; margin-left:6px; }
  .btn { display:inline-block; background:#f7d774; border:3px solid #3b3a36; border-radius:225px 15px 255px 15px / 15px 255px 15px 225px; padding:18px 44px; font-size:27px; font-weight:900; }
  .hint { font-size:21px; font-weight:700; letter-spacing:3px; color:#8a7f6e; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="head">
    <div class="tag kai">手帐 · GLM 5.2 开源实测</div>
  </div>

  <div><span class="scribble kai">光看跑分没用，复杂任务才见真章 ↓</span></div>
  <div class="seq">
    <div class="cell"><b class="kai">壹</b><span>百万上下文</span></div>
    <div class="cell"><b class="kai">贰</b><span>思考等级</span></div>
    <div class="cell"><b class="kai">叁</b><span>计算 −2.9×</span></div>
    <div class="cell"><b class="kai">肆</b><span>长程更稳</span></div>
  </div>
  <div class="foot">
    <div class="btn kai">左滑开拆 ⟶</div>
    <div class="hint">GLM 5.2 · 手帐系列 VOL.01</div>

</body>
