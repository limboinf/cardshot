<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>GLM 5.2 开源实测 · Swiss</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"Helvetica Neue","PingFang SC",-apple-system,sans-serif; background:#ffffff; color:#111; display:flex; flex-direction:column; padding:72px 68px 72px 100px; position:relative; }
  .cross { position:absolute; font-size:34px; font-weight:300; color:#c9c9c9; }
  .top { display:flex; justify-content:space-between; align-items:baseline; font-size:23px; font-weight:700; letter-spacing:3px; margin-bottom:44px; }
  .top span:last-child { color:#e0311d; }
  .kicker { display:flex; align-items:center; gap:24px; margin-bottom:30px; }
  .red { width:110px; height:110px; background:#e0311d; color:#fff; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:900; flex-shrink:0; }
  .kicker .en { font-size:32px; font-weight:900; letter-spacing:2px; color:#111; }
  h1 { font-size:126px; font-weight:900; line-height:1.14; letter-spacing:1px; margin-bottom:26px; }
  h1 .red-t { color:#e0311d; }
  .sub { font-size:33px; color:#3d3d3d; line-height:1.6; max-width:860px; margin-bottom:32px; }
  .midline { display:flex; align-items:center; gap:26px; }
  .midline .ln { flex:1; border-top:3px solid #e0311d; }
  .midline .txt { font-size:30px; font-weight:900; letter-spacing:1px; }
  .bignum { font-size:170px; font-weight:900; line-height:1; letter-spacing:6px; color:transparent; -webkit-text-stroke:4px #e0311d; margin:52px auto 0; }
  .seq { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:auto; margin-bottom:44px; }
  .seq .cell { border:3px solid #111; padding:18px 0 14px; text-align:center; }
  .seq .cell:nth-child(2n) { background:#111; color:#fff; }
  .seq .cell:nth-child(1) { background:#e0311d; border-color:#e0311d; color:#fff; }
  .seq .cell b { display:block; font-size:32px; font-weight:900; }
  .seq .cell span { font-size:20px; font-weight:700; letter-spacing:2px; }
  .bottom .bar { height:14px; background:#e0311d; margin-bottom:24px; }
  .foot { display:flex; justify-content:space-between; font-size:21px; font-weight:700; letter-spacing:3px; color:#111; }
</style>
</head>
<body>
  <div class="cross" style="top:56px; left:44%;">+</div>
  <div class="cross" style="top:46%; right:64px;">+</div>
  <div class="top"><span>GLM · HANDS-ON</span><span>开源日实测</span></div>
  <div class="kicker">
    <div class="red">5.2</div>
    <div class="en">OPEN-SOURCE BENCHMARK</div>
  </div>
  <h1>拿两个复杂任务<br>试了一下<br><span class="red-t">GLM 5.2</span></h1>
  <div class="sub">不只官方数据 · 第三方基准<br>把它排到 Claude Opus 4.8 前面</div>
  <div class="midline"><div class="ln"></div><div class="txt">4 FACTS / 2 TASKS</div></div>
  <div class="bignum">5.2</div>
  <div class="seq">
    <div class="cell"><b>01</b><span>百万上下文</span></div>
    <div class="cell"><b>02</b><span>思考等级</span></div>
    <div class="cell"><b>03</b><span>计算 −2.9×</span></div>
    <div class="cell"><b>04</b><span>长程稳定</span></div>
  </div>
  <div class="bottom">
    <div class="bar"></div>
    <div class="foot"><span>GLM 5.2</span><span>VOL.01 / 图文系列</span></div>
  </div>
</body>
</html>
