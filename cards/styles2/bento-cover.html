<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Bento 封面 · AI-Native SDLC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif; background:#f3f1ec; color:#17181a; display:flex; flex-direction:column; gap:24px; padding:56px 60px; }
  .cell { border-radius:28px; }
  .top { display:flex; gap:24px; }
  .kick { flex:1; background:#fff; padding:24px 30px; display:flex; align-items:center; gap:16px; font-size:25px; font-weight:700; color:#5c5f66; }
  .kick .dot { width:14px; height:14px; border-radius:50%; background:#ff5c38; }
  .idx { width:150px; background:#17181a; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .idx b { font-size:44px; } .idx span { font-size:18px; color:#9aa0a8; letter-spacing:3px; }
  .hero { flex:1; background:#17181a; color:#fff; padding:80px 76px; display:flex; flex-direction:column; justify-content:center; }
  .hero .en { font-size:26px; letter-spacing:10px; color:#8be28f; font-weight:700; margin-bottom:32px; }
  h1 { font-size:104px; font-weight:900; line-height:1.22; letter-spacing:-1px; }
  h1 .accent { color:#ffd43b; }
  .sub { margin-top:36px; font-size:32px; color:#b9bec7; line-height:1.5; }
  .foot { background:transparent; text-align:center; font-size:24px; color:#9a958a; letter-spacing:6px; font-weight:700; }
</style>
</head>
<body>
  <div class="top">
    <div class="kick cell"><div class="dot"></div>Anthropic 官方 · 2026.8 新文</div>
    <div class="idx cell"><b>01</b><span>COVER</span></div>
  </div>
  <div class="hero cell">
    <div class="en">AI-NATIVE SDLC</div>
    <h1>AI 写代码<br>快到飞起<br>先崩掉的是<span class="accent">流程</span></h1>
    <div class="sub">Anthropic 六阶段工作流 · 一份调研拆成一图流</div>
  </div>
  <div class="foot">SWIPE →</div>
</body>
</html>
