<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Riso 内容页 · 六阶段</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif; background:repeating-linear-gradient(0deg, rgba(29,63,163,.03) 0 1px, transparent 1px 3px), #fbf6ea; display:flex; flex-direction:column; padding:72px 72px 64px; position:relative; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  h2 { font-size:52px; font-weight:900; color:#1d3fa3; letter-spacing:1px; }
  h2 .p { color:#ff4d6d; }
  .pg { font-size:20px; font-weight:800; letter-spacing:3px; color:#ff4d6d; }
  .rule { height:4px; background:#1d3fa3; margin:20px 0 8px; }
  .rule2 { height:2px; background:#ff4d6d; margin-bottom:40px; }
  .list { display:flex; flex-direction:column; gap:26px; }
  .item { display:flex; gap:24px; align-items:flex-start; }
  .item .no { flex-shrink:0; width:74px; height:74px; border:4px solid #1d3fa3; border-radius:50%; color:#1d3fa3; font-size:30px; font-weight:900; display:flex; align-items:center; justify-content:center; background:#fbf6ea; box-shadow:4px 4px 0 rgba(255,77,109,.55); }
  .item .name { font-size:29px; font-weight:900; color:#1d3fa3; margin-bottom:6px; }
  .item .name span { font-size:20px; color:#5a6f9e; font-weight:700; margin-left:12px; letter-spacing:3px; }
  .item .mech { font-size:23px; line-height:1.5; color:#33406b; }
  .item .art { display:inline-block; margin-top:8px; font-size:19px; font-weight:800; color:#ff4d6d; border-bottom:3px solid #ff4d6d; font-family:ui-monospace,Menlo,monospace; }
  .concl { margin-top:auto; border:4px solid #1d3fa3; background:rgba(255,77,109,.10); padding:24px 30px; }
  .concl .t { font-size:19px; font-weight:900; letter-spacing:4px; color:#ff4d6d; margin-bottom:8px; }
  .concl p { font-size:25px; line-height:1.55; color:#1d3fa3; font-weight:700; }
  .concl b { color:#ff4d6d; }
</style>
</head>
<body>
  <div class="head"><h2>六阶段<span class="p">一图流</span></h2><div class="pg">RISO · PAGE 02</div></div>
  <div class="rule"></div><div class="rule2"></div>
  <div class="list">
    <div class="item"><div class="no">1</div><div><div class="name">Plan<span>需求</span></div><div class="mech">有想法的人直接跟 Claude 聊，不等 PM 排队写文档</div><div class="art">intent.md</div></div></div>
    <div class="item"><div class="no">2</div><div><div class="name">Design<span>设计</span></div><div class="mech">需求+设计压成一次会话，政策当场生效</div><div class="art">spec.md</div></div></div>
    <div class="item"><div class="no">3</div><div><div class="name">Build<span>开发</span></div><div class="mech">先出计划再动手，机构知识写进文件</div><div class="art">plan.md</div></div></div>
    <div class="item"><div class="no">4</div><div><div class="name">Test<span>测试</span></div><div class="mech">跑完测试才算完成，evals 进 CI</div><div class="art">evals/</div></div></div>
    <div class="item"><div class="no">5</div><div><div class="name">Deploy<span>发布</span></div><div class="mech">Agent 干到生产闸口为止，一步不越</div><div class="art">PR+评审</div></div></div>
    <div class="item"><div class="no">6</div><div><div class="name">Maintain<span>维护</span></div><div class="mech">确定性监控触发，诊断写回需求</div><div class="art">→ intent</div></div></div>
  </div>
  <div class="concl">
    <div class="t">一 句 话</div>
    <p>线性流水线变成<b>自动触发的闭环</b>，人只守在闸口做判断</p>
  </div>
</body>
</html>
