<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Doodle 手绘封面 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --sans-zh:"Noto Sans SC","PingFang SC",-apple-system,"Helvetica Neue",sans-serif; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:var(--sans-zh); color:#3b3a36; display:flex; flex-direction:column; padding:80px 84px 72px; position:relative; background:
    radial-gradient(900px 600px at 80% 0%, rgba(210,180,120,.14), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(210,180,120,.12), transparent 60%),
    repeating-linear-gradient(105deg, rgba(120,100,60,.035) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(12deg, rgba(120,100,60,.03) 0 1px, transparent 1px 5px),
    #f9f3e6; }
  .kai { font-family:"Kaiti SC","STKaiti","Noto Serif SC","PingFang SC",serif; }
  .frame { position:absolute; inset:44px; border:2px dashed rgba(59,58,54,.45); border-radius:18px 8px 22px 10px; pointer-events:none; }
  .tape { position:absolute; width:190px; height:44px; background:rgba(244,214,120,.65); border-left:2px dashed rgba(59,58,54,.18); border-right:2px dashed rgba(59,58,54,.18); }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:64px; }
  .tag { display:inline-block; background:#fffdf6; border:3px solid #3b3a36; border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; padding:14px 30px; font-size:25px; font-weight:800; transform:rotate(-1.2deg); }
  .star { font-size:52px; color:#d95763; transform:rotate(8deg); }
  h1 { font-size:115px; font-weight:700; line-height:1.30; letter-spacing:2px; margin-left:14px; }
  h1 .mk { color:#3b3a36; text-decoration:underline wavy #d95763 7px; text-underline-offset:16px; }
  .sub { margin-top:36px; font-size:34px; color:#6b6558; margin-left:18px; }
  .sub .arrow { color:#4a69bd; font-weight:800; }
  .note { margin:52px 0 0 22px; display:inline-block; font-size:33px; font-weight:800; background:linear-gradient(transparent 55%, rgba(247,215,116,.9) 55%); padding:4px 10px; transform:rotate(-1deg); }
  .scribble { margin:64px 0 0 96px; display:inline-block; border:3px solid #d95763; border-radius:15px 225px 15px 255px / 225px 15px 255px 15px; padding:16px 30px; font-size:28px; font-weight:800; color:#d95763; transform:rotate(1.2deg); background:rgba(255,253,246,.7); }
  .seq { margin-top:auto; display:flex; gap:16px; margin-bottom:44px; }
  .cell { flex:1; background:#fffdf6; border:3px solid #3b3a36; border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; text-align:center; padding:20px 0 16px; }
  .cell:nth-child(2n) { transform:rotate(1deg); border-radius:15px 225px 15px 255px / 225px 15px 255px 15px; }
  .cell:nth-child(1) { transform:rotate(-1deg); }
  .cell b { display:block; font-size:32px; font-weight:800; }
  .cell span { font-size:19px; font-weight:700; color:#8a7f6e; }
  .foot { display:flex; align-items:center; gap:26px; margin-left:6px; }
  .btn { display:inline-block; background:#f7d774; border:3px solid #3b3a36; border-radius:225px 15px 255px 15px / 15px 255px 15px 225px; padding:18px 44px; font-size:27px; font-weight:900; transform:rotate(-.8deg); }
  .hint { font-size:21px; font-weight:700; letter-spacing:3px; color:#8a7f6e; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="tape" style="top:64px; left:170px; transform:rotate(-4deg);"></div>
  <div class="tape" style="top:52px; right:150px; transform:rotate(5deg); width:150px;"></div>
  <div class="head">
    <div class="tag kai">手帐 · Anthropic 官方 2026.8</div>
    <div class="star">✗</div>
  </div>
  <h1 class="kai">AI 写代码<br>快到飞起，<br>先崩掉的是<span class="mk">流程</span></h1>
  <div class="sub">六阶段改造 · 一图流手帐 <span class="arrow">⟶</span> 画给赶时间的你</div>
  <div><span class="note kai">6 个阶段 · 1 个闭环 · 0 份排队文档</span></div>
  <div><span class="scribble kai">先别急着写代码，流程对了才不白干 ↓</span></div>
  <div class="seq">
    <div class="cell"><b class="kai">壹</b><span>PLAN 需求</span></div>
    <div class="cell"><b class="kai">贰</b><span>SPEC 设计</span></div>
    <div class="cell"><b class="kai">叁</b><span>BUILD 开发</span></div>
    <div class="cell"><b class="kai">肆</b><span>TEST 测试</span></div>
    <div class="cell"><b class="kai">伍</b><span>SHIP 发布</span></div>
    <div class="cell"><b class="kai">陆</b><span>LOOP 闭环</span></div>
  </div>
  <div class="foot">
    <div class="btn kai">左滑开拆 ⟶</div>
    <div class="hint">AI-NATIVE SDLC · 手帐系列 VOL.01</div>
  </div>
</body>
</html>
