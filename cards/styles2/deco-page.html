<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Art Deco 内容页 · 六阶段</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"Songti SC","STSong","Noto Serif SC",serif; background:linear-gradient(160deg,#0f241d 0%,#123128 55%,#0c1c16 100%); color:#f2ead8; display:flex; flex-direction:column; padding:88px 96px 80px; }
  .head { text-align:center; margin-bottom:44px; }
  .head .en { font-size:20px; letter-spacing:10px; color:#d4af37; font-weight:700; margin-bottom:18px; }
  h2 { font-size:54px; font-weight:900; letter-spacing:8px; }
  .head .diamond { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:24px; }
  .head .ln { width:120px; height:1px; background:rgba(212,175,55,.6); }
  .head .dm { width:12px; height:12px; background:#d4af37; transform:rotate(45deg); }
  .list { display:flex; flex-direction:column; }
  .item { display:flex; align-items:baseline; gap:26px; padding:22px 4px; border-bottom:1px solid rgba(212,175,55,.28); }
  .item:first-child { border-top:1px solid rgba(212,175,55,.28); }
  .item .no { font-size:26px; color:#d4af37; width:56px; flex-shrink:0; font-weight:700; }
  .item .name { font-size:30px; font-weight:800; width:250px; flex-shrink:0; letter-spacing:2px; }
  .item .name span { font-size:20px; color:#8f8a75; font-weight:400; margin-left:10px; letter-spacing:4px; }
  .item .mech { font-size:22px; color:#c6c0aa; line-height:1.55; flex:1; font-family:"PingFang SC",sans-serif; }
  .concl { margin-top:auto; text-align:center; }
  .concl .dm { width:12px; height:12px; background:#d4af37; transform:rotate(45deg); margin:0 auto 20px; }
  .concl p { font-size:28px; line-height:1.8; letter-spacing:2px; }
  .concl b { color:#d4af37; }
  .concl .src { margin-top:16px; font-size:17px; letter-spacing:6px; color:#8f8a75; }
</style>
</head>
<body>
  <div class="head">
    <div class="en">THE SIX STAGES</div>
    <h2>六阶段 · 一图流</h2>
    <div class="diamond"><div class="ln"></div><div class="dm"></div><div class="ln"></div></div>
  </div>
  <div class="list">
    <div class="item"><div class="no">Ⅰ</div><div class="name">Plan<span>需求</span></div><div class="mech">有想法的人直接跟 Claude 聊，不等 PM 排队写文档</div></div>
    <div class="item"><div class="no">Ⅱ</div><div class="name">Design<span>设计</span></div><div class="mech">需求与设计压成一次会话，政策当场生效</div></div>
    <div class="item"><div class="no">Ⅲ</div><div class="name">Build<span>开发</span></div><div class="mech">先出计划再动手，机构知识写进文件</div></div>
    <div class="item"><div class="no">Ⅳ</div><div class="name">Test<span>测试</span></div><div class="mech">跑完测试才算完成，evals 进 CI</div></div>
    <div class="item"><div class="no">Ⅴ</div><div class="name">Deploy<span>发布</span></div><div class="mech">Agent 干到生产闸口为止，一步不越</div></div>
    <div class="item"><div class="no">Ⅵ</div><div class="name">Maintain<span>维护</span></div><div class="mech">确定性监控触发，诊断写回需求，闭环</div></div>
  </div>
  <div class="concl">
    <div class="dm"></div>
    <p>流水线成为<b>闭环</b>，人守在闸口做判断</p>
    <div class="src">SOURCE · ANTHROPIC 2026.8.21</div>
  </div>
</body>
</html>
