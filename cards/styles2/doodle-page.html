<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Doodle 手绘内容页 · SDLC 六阶段</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif; color:#3b3a36; display:flex; flex-direction:column; padding:76px 84px 68px; position:relative; background:
    radial-gradient(900px 600px at 85% 0%, rgba(210,180,120,.14), transparent 60%),
    repeating-linear-gradient(105deg, rgba(120,100,60,.035) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(12deg, rgba(120,100,60,.03) 0 1px, transparent 1px 5px),
    #f9f3e6; }
  .kai { font-family:"Kaiti SC","STKaiti","PingFang SC",serif; }
  .tape { position:absolute; width:170px; height:42px; background:rgba(244,214,120,.65); border-left:2px dashed rgba(59,58,54,.18); border-right:2px dashed rgba(59,58,54,.18); top:52px; left:50%; transform:translateX(-50%) rotate(-2deg); z-index:2; }
  .head { background:#fffdf6; border:3px solid #3b3a36; border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; padding:26px 36px; display:flex; align-items:center; justify-content:space-between; transform:rotate(-.5deg); margin-bottom:34px; }
  .head h2 { font-size:42px; font-weight:700; }
  .head h2 .mk { text-decoration:underline wavy #d95763 5px; text-underline-offset:10px; }
  .head .pg { font-size:20px; color:#8a7f6e; font-weight:700; letter-spacing:2px; }
  .list { display:flex; flex-direction:column; gap:14px; flex:1; justify-content:space-evenly; }
  .row { display:flex; align-items:center; gap:22px; background:#fffdf6; border:3px solid #3b3a36; border-radius:255px 18px 235px 15px / 18px 235px 15px 255px; padding:16px 26px; }
  .row:nth-child(2n) { border-radius:18px 235px 15px 255px / 235px 18px 255px 15px; transform:rotate(.4deg); }
  .row:nth-child(1) { transform:rotate(-.4deg); }
  .row:nth-child(3) { transform:rotate(.3deg); }
  .row:nth-child(5) { transform:rotate(-.3deg); }
  .no { flex-shrink:0; width:62px; height:62px; border:3px solid #3b3a36; border-radius:50% 45% 52% 48% / 48% 52% 45% 55%; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; background:#f7d774; }
  .row:nth-child(2n) .no { background:#cfe3f7; }
  .name { font-size:30px; font-weight:700; width:210px; flex-shrink:0; }
  .name small { font-size:19px; color:#8a7f6e; font-weight:700; margin-left:10px; }
  .mech { font-size:22px; color:#57524a; line-height:1.5; flex:1; }
  .art { flex-shrink:0; font-size:19px; font-weight:800; color:#4a69bd; border-bottom:2px dashed rgba(74,105,189,.6); padding-bottom:2px; }
  .concl { margin-top:30px; background:#fffdf6; border:3px solid #3b3a36; border-radius:225px 15px 255px 15px / 15px 255px 15px 225px; padding:24px 32px; transform:rotate(-.4deg); }
  .concl .t { font-size:19px; font-weight:800; letter-spacing:4px; color:#d95763; margin-bottom:8px; }
  .concl p { font-size:26px; line-height:1.6; }
  .concl b { background:linear-gradient(transparent 55%, rgba(247,215,116,.85) 55%); font-weight:800; }
</style>
</head>
<body>
  <div class="tape"></div>
  <div class="head">
    <h2 class="kai">六阶段<span class="mk">一图流</span></h2>
    <div class="pg">手帐 · PAGE 02</div>
  </div>
  <div class="list">
    <div class="row"><div class="no kai">壹</div><div class="name kai">Plan<small>需求</small></div><div class="mech">有想法的人直接跟 Claude 聊，不等 PM 排队写文档</div><div class="art">intent.md</div></div>
    <div class="row"><div class="no kai">贰</div><div class="name kai">Design<small>设计</small></div><div class="mech">需求+设计压成一次会话，政策当场生效</div><div class="art">spec.md</div></div>
    <div class="row"><div class="no kai">叁</div><div class="name kai">Build<small>开发</small></div><div class="mech">先出计划再动手，机构知识写进文件</div><div class="art">plan.md</div></div>
    <div class="row"><div class="no kai">肆</div><div class="name kai">Test<small>测试</small></div><div class="mech">跑完测试才算完成，evals 进 CI</div><div class="art">evals/</div></div>
    <div class="row"><div class="no kai">伍</div><div class="name kai">Deploy<small>发布</small></div><div class="mech">Agent 干到生产闸口为止，一步不越</div><div class="art">PR+评审</div></div>
    <div class="row"><div class="no kai">陆</div><div class="name kai">Maintain<small>维护</small></div><div class="mech">确定性监控触发，诊断写回需求</div><div class="art">→ intent</div></div>
  </div>
  <div class="concl">
    <div class="t kai">一 句 话</div>
    <p>流水线变成<b>自动触发的闭环</b>，人只守在闸口做判断</p>
  </div>
</body>
</html>
