<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Swiss Editorial 封面 · AI-Native SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sans:"Inter","Noto Sans SC",-apple-system,sans-serif;
    --sans-zh:"Noto Sans SC","PingFang SC",-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#111213; --sub:#333333; --mute:#666666; --faint:#999999;
    --paper:#F4F4F2; --line:#DDDAD4; --accent:#4E7A52;
  }
  body { width:1080px; height:1440px; overflow:hidden; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; padding:72px 80px 60px; font-family:var(--sans-zh); }
  .head { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:18px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:20px; color:var(--ink); letter-spacing:1px; }
  .head .r { color:var(--faint); }
  .label { margin:64px 0 0; font-size:22px; font-weight:600; letter-spacing:7px; color:var(--accent); font-family:var(--sans); }
  h1 { margin:30px 0 0; font-size:100px; font-weight:300; line-height:1.32; letter-spacing:0; color:var(--ink); font-family:var(--sans); }
  .dash { width:80px; height:4px; background:var(--accent); margin:38px 0 0; }
  .lede { margin:36px 0 0; font-size:30px; line-height:1.8; color:var(--sub); max-width:860px; }
  .grid { margin-top:auto; margin-bottom:44px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cell { background:#ECEAE5; padding:26px 30px 24px; }
  .cell .no { font-family:var(--mono); font-size:18px; color:var(--faint); margin-bottom:14px; letter-spacing:2px; }
  .cell .k { font-size:27px; font-weight:500; color:var(--ink); font-family:var(--sans); }
  .cell .d { margin-top:8px; font-size:20px; line-height:1.5; color:var(--mute); }
  .cell.inv { background:var(--accent); }
  .cell.inv .no { color:rgba(255,255,255,.55); }
  .cell.inv .k { color:#fff; }
  .cell.inv .d { color:rgba(255,255,255,.82); }
  .foot { border-top:1px solid var(--line); padding-top:20px; display:flex; justify-content:space-between; font-family:var(--mono); font-size:19px; color:var(--faint); letter-spacing:2px; }
  .foot .go { color:var(--ink); }
</style>
</head>
<body>
  <div class="head"><span>AI-NATIVE SDLC · PLAYBOOK</span><span class="r">01</span></div>
  <div class="label">拆解 · SIX STAGES</div>
  <h1>AI 写代码快到飞起<br>先崩掉的是流程</h1>
  <div class="dash"></div>
  <div class="lede">软件开发六阶段被重新接线：从线性流水线，到自动触发的闭环。以下是 Anthropic 内部真实跑法。</div>
  <div class="grid">
    <div class="cell"><div class="no">01</div><div class="k">6 个阶段</div><div class="d">PLAN → SPEC → BUILD<br>→ TEST → SHIP → LOOP</div></div>
    <div class="cell"><div class="no">02</div><div class="k">1 个闭环</div><div class="d">确定性监控触发，诊断写回需求</div></div>
    <div class="cell"><div class="no">03</div><div class="k">0 份排队文档</div><div class="d">有想法的人直接跟 Claude 聊</div></div>
    <div class="cell inv"><div class="no">04</div><div class="k">1 个新位置</div><div class="d">人只守在生产闸口做判断</div></div>
  </div>
  <div class="foot"><span>ANTHROPIC OFFICIAL</span><span class="go">左滑开拆 →</span></div>
</body>
</html>
