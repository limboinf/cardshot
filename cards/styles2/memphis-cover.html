<!DOCTYPE html>

<title>Memphis 封面 · AI-Native SDLC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif; background:#fffdf6; color:#191919; display:flex; flex-direction:column; padding:80px 76px; position:relative; }
  .deco { position:absolute; }
  .circle { width:120px; height:120px; border-radius:50%; border:6px solid #191919; background:#ffd166; top:96px; right:84px; }
  .tri { width:0; height:0; border-left:52px solid transparent; border-right:52px solid transparent; border-bottom:90px solid #ef476f; top:640px; right:88px; transform:rotate(14deg); }
  .ring { width:88px; height:88px; border-radius:50%; border:14px solid #06d6a0; bottom:420px; left:70px; }
  .dotsbox { width:220px; height:130px; background:radial-gradient(circle,#191919 4px,transparent 4.5px); background-size:26px 26px; bottom:150px; right:84px; opacity:.8; }
  .zig { height:22px; background:repeating-linear-gradient(135deg,#118ab2 0 14px,transparent 14px 28px); top:790px; left:76px; width:180px; }
  .top { display:inline-flex; align-self:flex-start; background:#118ab2; color:#fff; font-size:24px; font-weight:800; padding:14px 30px; border-radius:999px; letter-spacing:2px; margin-bottom:64px; }
  h1 { font-size:96px; font-weight:900; line-height:1.22; letter-spacing:-1px; margin-bottom:34px; }
  h1 .mk { background:linear-gradient(transparent 58%, #ffd166 58%); }
  h1 .hi { color:#ef476f; }
  .sub { font-size:27px; color:#5f5b52; line-height:1.6; max-width:780px; }
  .bottom { margin-top:auto; display:flex; align-items:center; gap:22px; }
  .btn { background:#191919; color:#fff; font-size:25px; font-weight:800; padding:18px 40px; border-radius:999px; box-shadow:6px 6px 0 #06d6a0; letter-spacing:2px; }
  .foot { font-size:21px; font-weight:700; letter-spacing:3px; color:#8a857a; }
</style>
</head>
<body>
  <div class="deco circle"></div>
  <div class="deco tri"></div>
  <div class="deco ring"></div>
