<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Riso 封面 · AI-Native SDLC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif; background:repeating-linear-gradient(0deg, rgba(29,63,163,.03) 0 1px, transparent 1px 3px), #fbf6ea; color:#1d3fa3; display:flex; flex-direction:column; padding:76px 72px; position:relative; }
  .dots { position:absolute; width:300px; height:300px; background:radial-gradient(circle, rgba(255,77,109,.85) 3.5px, transparent 4px); background-size:22px 22px; }
  .top { display:flex; align-items:center; gap:20px; margin-bottom:auto; }
  .chip { background:#1d3fa3; color:#fbf6ea; font-size:23px; font-weight:800; padding:12px 26px; letter-spacing:2px; }
  .chip.pink { background:#ff4d6d; }
  h1 { font-size:84px; font-weight:900; line-height:1.14; letter-spacing:-1px; color:rgba(29,63,163,.88); }
  h1 .mis { text-shadow:5px 5px 0 rgba(255,77,109,.85); }
  h1 .zh { display:block; font-size:84px; letter-spacing:2px; margin-top:22px; color:#1d3fa3; font-weight:900; text-shadow:4px 4px 0 rgba(255,77,109,.75); }
  .sub { font-size:26px; color:#33406b; line-height:1.6; margin-top:34px; max-width:760px; font-weight:600; }
  .overlap { margin-top:auto; margin-bottom:36px; display:flex; align-items:center; gap:30px; }
  .overlap .circles { display:flex; }
  .overlap .c { width:130px; height:130px; border-radius:50%; mix-blend-mode:multiply; }
  .overlap .c1 { background:rgba(29,63,163,.85); }
  .overlap .c2 { background:rgba(255,77,109,.80); margin-left:-46px; }
  .overlap .txt { font-size:25px; font-weight:900; color:#1d3fa3; line-height:1.6; }
  .overlap .txt .p { color:#ff4d6d; }
  .stamp { display:inline-flex; align-items:center; gap:16px; border:5px solid #ff4d6d; color:#ff4d6d; border-radius:18px; padding:14px 30px; font-size:24px; font-weight:900; letter-spacing:4px; margin-bottom:30px; }
  .bar { height:18px; background:linear-gradient(90deg,#1d3fa3 0 55%, #ff4d6d 55%); margin-bottom:20px; }
  .foot { display:flex; justify-content:space-between; font-size:20px; font-weight:800; letter-spacing:3px; color:#1d3fa3; }
</style>
</head>
<body>
  <div class="dots" style="top:100px; right:72px;"></div>
  <div class="dots" style="top:580px; right:72px; width:220px; height:130px; background:radial-gradient(circle, rgba(29,63,163,.5) 3.5px, transparent 4px); background-size:22px 22px;"></div>
  <div class="top"><div class="chip">Anthropic 官方</div><div class="chip pink">6 阶段 · 1 闭环</div></div>
  <h1><span class="mis" data-t="AI-NATIVE">AI-NATIVE</span><br><span class="mis" data-t="SDLC">SDLC</span><span class="zh">先崩掉的是流程</span></h1>
  <div class="sub">AI 写代码快到飞起，流程先撑不住。六阶段改造，一图流拆解。</div>
  <div class="overlap">
    <div class="circles"><div class="c c1"></div><div class="c c2"></div></div>
    <div class="txt">双色套印 = 两个世界叠加<br><span class="p">写代码 × 流程，缺一不可</span></div>
  </div>
  <div class="stamp">左滑开拆 · SIX STAGES</div>
  <div class="bar"></div>
  <div class="foot"><span>AI-NATIVE SDLC · 图文系列</span><span>2026.08</span></div>
</body>
</html>
