<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="card-size" content="1080x1440">
<title>Riso 封面 · AI-Native SDLC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif; background:repeating-linear-gradient(0deg, rgba(29,63,163,.03) 0 1px, transparent 1px 3px), #fbf6ea; color:#1d3fa3; display:flex; flex-direction:column; padding:76px 72px; position:relative; }
  .dots { position:absolute; width:300px; height:300px; background:radial-gradient(circle, rgba(255,77,109,.85) 3.5px, transparent 4px); background-size:22px 22px; }
  .top { display:flex; align-items:center; gap:20px; margin-bottom:auto; }
  .chip { background:#1d3fa3; color:#fbf6ea; font-size:23px; font-weight:800; padding:12px 26px; letter-spacing:2px; }
  .chip.pink { background:#ff4d6d; }
  h1 { font-size:104px; font-weight:900; line-height:1.12; letter-spacing:-2px; color:#1d3fa3; }
  h1 .mis { text-shadow:6px 6px 0 #ff4d6d; }
  h1 .zh { display:block; font-size:60px; letter-spacing:4px; margin-top:26px; color:#1d3fa3; }
  .sub { font-size:26px; color:#5a6f9e; line-height:1.6; margin-top:36px; max-width:740px; font-weight:600; }
  .bottom { margin-top:auto; }
  .stamp { display:inline-flex; align-items:center; gap:16px; border:5px solid #ff4d6d; color:#ff4d6d; border-radius:18px; padding:14px 30px; font-size:24px; font-weight:900; letter-spacing:4px; margin-bottom:30px; }
  .bar { height:18px; background:linear-gradient(90deg,#1d3fa3 0 55%, #ff4d6d 55%); margin-bottom:20px; }
  .foot { display:flex; justify-content:space-between; font-size:20px; font-weight:800; letter-spacing:3px; color:#1d3fa3; }
</style>
</head>
<body>
  <div class="dots" style="top:100px; right:72px;"></div>
  <div class="dots" style="top:580px; right:72px; width:220px; height:130px; background:radial-gradient(circle, rgba(29,63,163,.5) 3.5px, transparent 4px); background-size:22px 22px;"></div>
  <div class="top"><div class="chip">RISO PRINT No.01</div><div class="chip pink">Anthropic 官方</div></div>
  <h1><span class="mis" data-t="AI-NATIVE">AI-NATIVE</span><br><span class="mis" data-t="SDLC">SDLC</span><span class="zh">六阶段流程改造</span></h1>
  <div class="sub">AI 写代码快到飞起，先崩掉的是流程。从线性流水线到自动闭环，一图流拆解内部真实跑法。</div>
  <div class="bottom">
    <div class="stamp">两色印刷 · 双色套版</div>
    <div class="bar"></div>
    <div class="foot"><span>BLUE + FLUORESCENT PINK</span><span>2026.08</span></div>
  </div>
</body>
</html>
