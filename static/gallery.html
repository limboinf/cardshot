<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cardshot — 风格库 Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --line: #2a2f3c;
    --text: #e8eaf0; --muted: #8b93a7; --accent: #5b8cff; --accent2: #7c5bff;
    --ok: #3ecf8e; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { font-weight: 700; font-size: 15px; }
  .logo span { color: var(--accent); }
  .count { font-size: 13px; color: var(--muted); }
  .spacer { flex: 1; }
  button, a.btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  button:hover, a.btn:hover { border-color: var(--accent); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; font-weight: 600; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  main { max-width: 1440px; margin: 0 auto; padding: 24px 20px 60px; }
  .group { margin-bottom: 44px; }
  .group-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .group-head h2 { font-size: 17px; font-weight: 700; }
  .group-head .n { font-size: 13px; color: var(--muted); }
  .group-head button { margin-left: auto; font-size: 12px; padding: 5px 10px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: border-color .15s; }
  .tile:hover { border-color: var(--accent); }
  .thumb { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #22262f; overflow: hidden; }
  .thumb iframe { border: 0; pointer-events: none; transform-origin: 0 0; position: absolute; top: 0; left: 0; width: 1080px; height: 1440px; background: #fff; }
  .meta { padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
  .meta .name { font-size: 13px; font-weight: 600; word-break: break-all; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
  .chip.cover { background: rgba(124,91,255,.18); color: #b7a4ff; }
  .chip.page { background: rgba(94,140,255,.16); color: #9db9ff; }
  .chip.single { background: rgba(62,207,142,.14); color: #7fe0b4; }
  .acts { padding: 0 12px 12px; display: flex; gap: 8px; }
  .acts button, .acts a.btn { font-size: 12px; padding: 5px 10px; flex: 1; text-align: center; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 18px; font-size: 13px; transition: transform .2s; z-index: 20; max-width: 80vw;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: var(--ok); }
</style>
</head>
<body>
<header>
  <div class="logo">🎨 风格<span>库</span></div>
  <div class="count" id="count"></div>
  <div class="spacer"></div>
  <a class="btn" href="/">← 返回工作室</a>
  <button onclick="load()">刷新</button>
</header>
<main id="main"><div class="count">加载中…</div></main>
<div id="toast"></div>

<script>
let toastTimer;
function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (ok ? ' ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2600);
}

function kindOf(file) {
  const stem = file.split('/').pop().replace('.html', '');
  if (stem.includes('cover')) return { k: 'cover', label: '封面' };
  if (stem.includes('page')) return { k: 'page', label: '内容页' };
  return { k: 'single', label: '样卡' };
}

function fitIframes() {
  document.querySelectorAll('.thumb').forEach(thumb => {
    const f = thumb.querySelector('iframe');
    if (f) f.style.transform = `scale(${thumb.clientWidth / 1080})`;
  });
}

async function shootCard(file, btn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = '截图中…';
  try {
    const r = await fetch('/api/shoot', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file, scale: 2 })
    }).then(r => r.json());
    if (r.error) throw new Error(r.error);
    toast(`✅ 已出图: ${r.name}`, true);
  } catch (e) { toast(`❌ ${e.message}`); }
  btn.disabled = false; btn.textContent = old;
}

async function load() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="count">加载中…</div>';
  const data = await fetch('/api/styles').then(r => r.json());
  const groups = data.groups || [];
  const total = groups.reduce((s, g) => s + g.cards.length, 0);
  document.getElementById('count').textContent = groups.length ? `${groups.length} 组 · ${total} 张样卡` : 'cards/styles* 下还没有样卡';
  main.innerHTML = '';
  let n = 0;
  for (const g of groups) {
    const sec = document.createElement('div');
    sec.className = 'group';
    sec.innerHTML = `<div class="group-head"><h2>${g.label}</h2><span class="n">${g.dir}/ · ${g.cards.length} 张</span>
      <button data-dir="${g.dir}">组内全部截图</button></div><div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    for (const file of g.cards) {
      n++;
      const kind = kindOf(file);
      const name = file.split('/').pop().replace('.html', '');
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `
        <div class="thumb"><iframe loading="lazy" src="/cards/${file}" scrolling="no"></iframe></div>
        <div class="meta"><span class="chip ${kind.k}">${kind.label}</span><span class="name">${name}</span></div>
        <div class="acts">
          <button class="shot">📷 截图</button>
          <a class="btn" href="/cards/${file}" target="_blank">↗ 原件</a>
        </div>`;
      tile.querySelector('.shot').onclick = e => shootCard(file, e.target);
      grid.appendChild(tile);
    }
    sec.querySelector('.group-head button').onclick = async e => {
      const btn = e.target; btn.disabled = true;
      for (const file of g.cards) {
        toast(`截图中: ${file} …`);
        try {
          const r = await fetch('/api/shoot', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file, scale: 2 })
          }).then(r => r.json());
          if (r.error) throw new Error(r.error);
        } catch (err) { toast(`❌ ${file}: ${err.message}`); break; }
      }
      btn.disabled = false;
      toast(`✅ ${g.dir}/ 整组完成, 落 output/`, true);
    };
    main.appendChild(sec);
  }
  fitIframes();
}
window.addEventListener('resize', fitIframes);
load();
</script>
</body>
</html>
